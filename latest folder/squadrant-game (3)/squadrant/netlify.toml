[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # CRA treats warnings as errors when CI=true; keep local-style warnings non-fatal.
  CI = "false"

# SPA fallback so deep links load the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
